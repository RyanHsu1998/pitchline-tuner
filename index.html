<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0812" />
  <meta name="description" content="私密、实时的乐器调音器。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pitchline" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Pitchline — 调音器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --surface: rgba(255,255,255,.075);
      --surface-strong: rgba(255,255,255,.11);
      --line: rgba(255,255,255,.14);
      --line-soft: rgba(255,255,255,.08);
      --text: #f5f7fb;
      --muted: #969cab;
      --dim: #646b7a;
      --accent: #c8ff75;
      --accent-strong: #9de85c;
      --cyan: #a8e9ff;
      --violet: #c4b3ff;
      --warm: #ffb874;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tune-glow: 0;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow-x: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 75% 44% at 50% -5%, rgba(180, 208, 255, .12), transparent 72%),
        radial-gradient(ellipse 64% 45% at 7% 68%, rgba(142, 110, 255, .10), transparent 72%),
        radial-gradient(ellipse 58% 40% at 96% 77%, rgba(130, 255, 202, .07), transparent 72%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 42vmax;
      height: 42vmax;
      border-radius: 50%;
      content: "";
      pointer-events: none;
      filter: blur(78px);
      opacity: .20;
      animation: drift 18s ease-in-out infinite alternate;
    }
    body::before { left: -32vmax; bottom: -18vmax; background: #5042d5; }
    body::after { right: -32vmax; top: 26vmax; background: #43d5bd; animation-delay: -7s; }
    @keyframes drift { from { transform: translate3d(-2%, 0, 0) scale(1); } to { transform: translate3d(5%, -4%, 0) scale(1.08); } }

    .flow-layer {
      position: fixed;
      z-index: 0;
      inset: -18%;
      pointer-events: none;
      opacity: .42;
      filter: blur(44px) saturate(1.45);
      background: conic-gradient(from 190deg at 46% 43%, rgba(69,177,255,.20), rgba(145,101,255,.18) 18%, rgba(255,91,205,.25) 38%, rgba(255,170,87,.18) 54%, rgba(72,226,218,.20) 72%, rgba(86,111,255,.19) 88%, rgba(69,177,255,.20));
      mix-blend-mode: screen;
      transform: translate3d(-2%, 1%, 0) rotate(-4deg) scale(1.06);
      animation: auroraFlow 18s ease-in-out infinite alternate;
      will-change: transform;
    }
    .flow-layer::before,
    .flow-layer::after {
      position: absolute;
      inset: 12% -12%;
      border-radius: 50%;
      content: "";
      pointer-events: none;
      filter: blur(28px);
      will-change: transform;
    }
    .flow-layer::before {
      background: linear-gradient(112deg, transparent 22%, rgba(68,184,255,.28) 36%, rgba(244,114,220,.32) 49%, rgba(255,178,87,.24) 64%, transparent 80%);
      transform: rotate(-12deg) translate3d(-4%, 2%, 0) scale(1.05);
      animation: ribbonFlow 14s ease-in-out infinite alternate;
    }
    .flow-layer::after {
      inset: 24% -18% 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,146,100,.25), transparent 48%), radial-gradient(ellipse at 28% 35%, rgba(73,225,220,.24), transparent 45%);
      transform: translate3d(3%, -2%, 0) scale(1.08);
      animation: ribbonFlowAlt 17s ease-in-out infinite alternate;
    }
    @keyframes auroraFlow {
      0% { transform: translate3d(-3%, 1%, 0) rotate(-5deg) scale(1.06); }
      50% { transform: translate3d(2%, -2%, 0) rotate(2deg) scale(1.10); }
      100% { transform: translate3d(4%, 3%, 0) rotate(6deg) scale(1.05); }
    }
    @keyframes ribbonFlow {
      0% { transform: rotate(-12deg) translate3d(-4%, 2%, 0) scale(1.05); }
      50% { transform: rotate(-4deg) translate3d(3%, -3%, 0) scale(1.12); }
      100% { transform: rotate(8deg) translate3d(7%, 2%, 0) scale(1.04); }
    }
    @keyframes ribbonFlowAlt {
      0% { transform: translate3d(3%, -2%, 0) scale(1.08); }
      50% { transform: translate3d(-4%, 2%, 0) scale(1.16); }
      100% { transform: translate3d(2%, 5%, 0) scale(1.06); }
    }

    button, input { font: inherit; }
    button { -webkit-appearance: none; }
    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      min-height: 100dvh;
      margin: auto;
      padding: calc(20px + var(--safe-top)) 20px calc(22px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 24px; }
    .ambient-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.32);
      box-shadow: 0 0 0 6px rgba(255,255,255,.035);
      transition: .35s ease;
    }
    .ambient-dot.active {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(200,255,117,.08), 0 0 20px rgba(200,255,117,.42);
    }
    .topbar-mark { width: 22px; height: 22px; color: rgba(255,255,255,.4); }
    .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(36px, 8vh, 88px) 0 34px; }
    .hero { position: relative; display: flex; flex-direction: column; align-items: center; }
    .halo {
      position: absolute;
      top: -58px;
      width: min(76vw, 340px);
      height: min(76vw, 340px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,255,117,.10), rgba(166,210,255,.04) 35%, transparent 68%);
      filter: blur(11px);
      opacity: .34;
      transform: scale(.88);
      transition: .7s ease;
      pointer-events: none;
    }
    .listening .halo { opacity: .92; transform: scale(1.08); animation: breathe 2.8s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { filter: blur(11px); } 50% { filter: blur(20px); } }
    .note-wrap { position: relative; z-index: 1; height: 164px; display: flex; justify-content: center; align-items: flex-start; }
    .note {
      color: #fbfcff;
      font-size: clamp(132px, 36vw, 194px);
      font-weight: 720;
      letter-spacing: -.13em;
      line-height: .80;
      text-indent: -.10em;
      text-shadow: 0 8px 52px rgba(235,242,255,.11);
      transition: color .25s ease, text-shadow .25s ease, transform .25s ease;
    }
    .note.empty { color: rgba(255,255,255,.13); text-shadow: none; }
    .note.live { transform: translateY(-2px); }
    .octave { margin: 15px 0 0 13px; color: var(--muted); font-size: 21px; font-weight: 650; letter-spacing: -.06em; }
    .frequency { position: relative; z-index: 1; min-height: 22px; margin-top: 3px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .frequency strong { color: #e6e9ef; font-size: 16px; font-weight: 620; letter-spacing: -.025em; }
    .frequency small { margin-left: 3px; color: var(--muted); font-size: 11px; }

    .meter {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      margin-top: 35px;
      padding: 25px 18px 17px;
      border: 1px solid var(--line-soft);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
      box-shadow: 0 24px 55px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.10);
      -webkit-backdrop-filter: blur(26px) saturate(1.4);
      backdrop-filter: blur(26px) saturate(1.4);
    }
    .meter::before {
      position: absolute;
      z-index: -1;
      inset: auto 14% -72% 14%;
      height: 150px;
      border-radius: 50%;
      background: rgba(175,210,255,.08);
      filter: blur(25px);
      opacity: 0;
      transition: .3s ease;
      content: "";
    }
    .meter.in-tune::before { background: rgba(200,255,117,.14); opacity: 1; }
    .scale { position: relative; height: 25px; display: flex; align-items: center; justify-content: space-between; }
    .scale::before { position: absolute; left: 0; right: 0; top: 50%; height: 2px; border-radius: 99px; background: linear-gradient(90deg, rgba(168,233,255,.55), rgba(255,255,255,.14) 42%, rgba(200,255,117,.70) 50%, rgba(255,255,255,.14) 58%, rgba(255,184,116,.55)); content: ""; opacity: .72; }
    .tick { position: relative; width: 1px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.3); }
    .tick.major { height: 10px; background: rgba(255,255,255,.58); }
    .tick.center { width: 2px; height: 18px; background: var(--accent); box-shadow: 0 0 12px rgba(200,255,117,.65); }
    .needle { position: absolute; z-index: 1; left: 50%; top: -7px; width: 3px; height: 39px; border-radius: 99px; background: #f3f7ff; box-shadow: 0 0 0 5px rgba(240,245,255,.08), 0 4px 15px rgba(0,0,0,.42); transform: translateX(-50%); transition: transform 90ms linear, background-color .18s, box-shadow .18s; }
    .meter.in-tune .needle { background: var(--accent); box-shadow: 0 0 0 5px rgba(200,255,117,.12), 0 0 21px rgba(200,255,117,.50); }
    .meter.sharp .needle { background: var(--warm); }
    .meter.flat .needle { background: var(--cyan); }
    .reading { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 39px; margin-top: 11px; }
    .cents { color: #e6eaf2; font-size: 25px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -.06em; }
    .reading-status { display: inline-grid; place-items: center; width: 23px; height: 23px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; color: var(--dim); font-size: 13px; font-weight: 800; }
    .meter.in-tune .cents, .meter.in-tune .reading-status { color: var(--accent); border-color: rgba(200,255,117,.32); }
    .meter.sharp .cents, .meter.sharp .reading-status { color: var(--warm); border-color: rgba(255,184,116,.28); }
    .meter.flat .cents, .meter.flat .reading-status { color: var(--cyan); border-color: rgba(168,233,255,.28); }

    .controls { display: grid; gap: 14px; }
    .listen {
      position: relative;
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 2px auto 0;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 50%;
      color: #162000;
      background: linear-gradient(145deg, #dcff94, #a3ed62);
      box-shadow: 0 14px 35px rgba(153,211,70,.23), inset 0 1px 0 rgba(255,255,255,.66), 0 0 0 8px rgba(200,255,117,.06);
      cursor: pointer;
      transition: transform .16s ease, background .25s ease, box-shadow .25s ease;
    }
    .listen:active, .adjust:active, .reset:active { transform: scale(.93); }
    .listen.listening { color: #f4f7fb; background: linear-gradient(145deg, #444b5c, #252a35); box-shadow: 0 14px 35px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 8px rgba(255,255,255,.04); }
    .listen .icon { width: 25px; height: 25px; fill: currentColor; }
    .listen .stop-icon { display: none; }
    .listen.listening .mic-icon { display: none; }
    .listen.listening .stop-icon { display: block; }
    .glass { border: 1px solid var(--line-soft); background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035)); box-shadow: 0 18px 36px rgba(0,0,0,.17), inset 0 1px 0 rgba(255,255,255,.08); -webkit-backdrop-filter: blur(22px) saturate(1.35); backdrop-filter: blur(22px) saturate(1.35); }
    .reference { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px 12px; border-radius: 22px; }
    .a4-meta { display: flex; align-items: baseline; gap: 10px; padding-left: 4px; }
    .a4-tag { color: var(--muted); font-size: 12px; font-weight: 760; letter-spacing: .06em; }
    .value { color: #f3f6fb; font-size: 22px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -.05em; }
    .value small { margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .ref-controls { display: flex; align-items: center; gap: 9px; }
    .adjust, .reset { display: grid; place-items: center; border: 1px solid rgba(255,255,255,.14); color: #e8ecf4; background: rgba(255,255,255,.06); cursor: pointer; transition: transform .16s ease, background .18s ease, border-color .18s ease; }
    .adjust { width: 34px; height: 34px; border-radius: 12px; font-size: 22px; font-weight: 350; line-height: 1; }
    .adjust:hover, .reset:hover { border-color: rgba(255,255,255,.30); background: rgba(255,255,255,.11); }
    .reference-extra { display: flex; align-items: center; gap: 13px; margin-top: 10px; padding: 0 4px; }
    .range-wrap { flex: 1; }
    input[type=range] { width: 100%; height: 4px; appearance: none; border-radius: 99px; outline: none; background: linear-gradient(90deg, var(--accent) var(--range-progress,50%), rgba(255,255,255,.13) var(--range-progress,50%)); }
    input[type=range]::-webkit-slider-thumb { width: 17px; height: 17px; appearance: none; border: 3px solid var(--bg); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px rgba(200,255,117,.34), 0 2px 9px rgba(0,0,0,.35); }
    input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 3px solid var(--bg); border-radius: 50%; background: var(--accent); }
    .reset { min-width: 36px; height: 30px; padding: 0 9px; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 720; }
    .notice { min-height: 17px; margin: 12px 4px 0; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.35; }
    .notice:not(.error) { visibility: hidden; }
    .notice.error { color: #ff9696; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .listen:focus-visible, .adjust:focus-visible, .reset:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (min-width: 520px) { .app { padding-left: 30px; padding-right: 30px; } .main { padding-top: 74px; } }
    @media (max-height: 700px) { .main { padding-top: 25px; padding-bottom: 20px; } .meter { margin-top: 22px; } .note-wrap { height: 140px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* 2026 glass treatment: lavender, orchid and soft pink instead of green. */
    :root {
      --bg: #0b0812;
      --accent: #f5b4e2;
      --accent-strong: #d79bff;
      --cyan: #c7b8ff;
      --violet: #dcb7ff;
      --warm: #ffadc9;
      --muted: #a9a1b5;
      --dim: #726981;
      --line-soft: rgba(255,230,250,.10);
    }
    body {
      background:
        linear-gradient(145deg, rgba(3,5,12,.36), rgba(8,8,18,.08) 42%, rgba(2,3,8,.44)),
        radial-gradient(ellipse 80% 48% at 50% -8%, rgba(127,168,255,.18), transparent 72%),
        radial-gradient(ellipse 64% 48% at 5% 70%, rgba(106,71,255,.16), transparent 72%),
        radial-gradient(ellipse 60% 45% at 96% 75%, rgba(255,116,188,.13), transparent 72%),
        radial-gradient(ellipse 55% 34% at 52% 103%, rgba(255,163,77,.12), transparent 74%),
        var(--bg);
    }
    body::before { background: #6541bf; opacity: .26; }
    body::after { background: #3a8bff; opacity: .22; }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
    }
    html { min-height: 100svh; }
    body {
      min-height: 100svh;
      min-height: 100dvh;
      overscroll-behavior-y: none;
      padding-bottom: var(--safe-bottom);
    }
    .app {
      min-height: 100svh;
      min-height: calc(100dvh + var(--safe-bottom));
    }
    .top-space { height: 20px; }
    .app { width: min(100%, 520px); padding-top: calc(13px + var(--safe-top)); padding-bottom: calc(18px + var(--safe-bottom)); }
    .main { padding: clamp(24px, 5.4vh, 58px) 0 26px; }
    .halo { top: -50px; width: min(72vw, 310px); height: min(72vw, 310px); background: radial-gradient(circle, rgba(245,180,226,.16), rgba(197,174,255,.10) 38%, transparent 70%); }
    .note-wrap { height: 148px; }
    .note { font-size: clamp(124px, 34vw, 184px); text-shadow: 0 8px 52px rgba(240,204,255,.14); }
    .note.empty { color: rgba(255,235,250,.20); }
    .octave { margin-top: 14px; color: #aaa0b9; }
    .frequency strong { color: #f2eafa; }
    .meter { margin-top: 25px; padding: 22px 17px 15px; border-radius: 30px; background: linear-gradient(145deg, rgba(255,230,249,.11), rgba(183,139,255,.045)); box-shadow: 0 24px 55px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,235,250,.12); }
    .meter::before { background: rgba(228,163,230,.12); }
    .scale::before { background: linear-gradient(90deg, rgba(194,177,255,.58), rgba(255,255,255,.15) 40%, rgba(245,180,226,.85) 50%, rgba(255,255,255,.15) 60%, rgba(255,170,202,.62)); }
    .tick.center { background: var(--accent); box-shadow: 0 0 13px rgba(245,180,226,.72); }
    .meter.in-tune::before { background: rgba(245,180,226,.18); }
    .meter.in-tune .needle { background: var(--accent); box-shadow: 0 0 0 5px rgba(245,180,226,.13), 0 0 21px rgba(245,180,226,.52); }
    .meter.sharp .needle { background: var(--warm); }
    .meter.flat .needle { background: var(--cyan); }
    .meter.in-tune .cents, .meter.in-tune .reading-status { color: var(--accent); border-color: rgba(245,180,226,.36); }
    .meter.sharp .cents, .meter.sharp .reading-status { color: var(--warm); border-color: rgba(255,173,201,.32); }
    .meter.flat .cents, .meter.flat .reading-status { color: var(--cyan); border-color: rgba(199,184,255,.32); }
    .controls { gap: 12px; }
    .listen-dock { position: relative; display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 92px; padding: 10px 20px; border-radius: 30px; background: linear-gradient(145deg, rgba(255,226,248,.12), rgba(197,161,255,.055)); box-shadow: 0 20px 40px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,238,252,.13); }
    .listen-dock .ambient-dot { position: absolute; top: 14px; right: 17px; width: 6px; height: 6px; background: rgba(255,255,255,.25); box-shadow: 0 0 0 5px rgba(255,255,255,.03); }
    .listen-dock .ambient-dot.active { background: var(--accent); box-shadow: 0 0 0 5px rgba(245,180,226,.10), 0 0 18px rgba(245,180,226,.52); }
    .listen { width: 66px; height: 66px; margin: 0; color: #311d3d; background: linear-gradient(140deg, #ffd7ed, #d9bbff); box-shadow: 0 14px 34px rgba(236,141,207,.28), inset 0 1px 0 rgba(255,255,255,.72), 0 0 0 8px rgba(245,180,226,.08); }
    .listen.listening { color: #fff8ff; background: linear-gradient(140deg, #8f6ad0, #da72b4); box-shadow: 0 14px 34px rgba(195,104,184,.34), inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 8px rgba(245,180,226,.08); }
    .signal { display: flex; align-items: center; justify-content: center; gap: 4px; width: 43px; height: 34px; opacity: .42; }
    .signal i { display: block; width: 3px; height: 10px; border-radius: 99px; background: linear-gradient(180deg, var(--violet), var(--accent)); transform-origin: center; }
    .signal i:nth-child(1) { height: 8px; }.signal i:nth-child(2) { height: 15px; }.signal i:nth-child(3) { height: 25px; }.signal i:nth-child(4) { height: 15px; }.signal i:nth-child(5) { height: 8px; }
    .listen-dock:has(.listen.listening) .signal { opacity: .95; }
    .listen-dock:has(.listen.listening) .signal i { animation: voicePulse 1.1s ease-in-out infinite; }
    .listen-dock:has(.listen.listening) .signal i:nth-child(2) { animation-delay: -.22s; }.listen-dock:has(.listen.listening) .signal i:nth-child(3) { animation-delay: -.45s; }.listen-dock:has(.listen.listening) .signal i:nth-child(4) { animation-delay: -.68s; }
    @keyframes voicePulse { 0%,100% { transform: scaleY(.58); } 50% { transform: scaleY(1.14); } }
    .reference { padding: 12px 14px 11px; border-radius: 24px; background: linear-gradient(145deg, rgba(255,230,249,.10), rgba(194,153,255,.045)); }
    .a4-tag { color: #bdb2c8; }.value { color: #f8effa; }
    .adjust { color: #f4e8f8; background: linear-gradient(145deg, rgba(255,210,241,.16), rgba(195,164,255,.10)); border-color: rgba(255,220,245,.18); }
    .adjust:hover, .reset:hover { border-color: rgba(255,213,241,.40); background: rgba(255,214,242,.15); }
    input[type=range] { background: linear-gradient(90deg, var(--accent) var(--range-progress,50%), rgba(255,225,246,.13) var(--range-progress,50%)); }
    input[type=range]::-webkit-slider-thumb { background: var(--accent); box-shadow: 0 0 0 1px rgba(245,180,226,.42), 0 2px 9px rgba(0,0,0,.35); }
    input[type=range]::-moz-range-thumb { background: var(--accent); }
    .reset { background: rgba(255,214,242,.08); color: #c2b6ca; }

    /* Keep the note, accidental and octave readable as one compact lockup. */
    .note-wrap { gap: 0; padding: 0 10px; }
    .note {
      max-width: calc(100vw - 92px);
      font-size: clamp(94px, 31vw, 166px);
      letter-spacing: -.025em;
      text-indent: 0;
      line-height: .86;
      white-space: nowrap;
      font-variant-ligatures: none;
    }
    .octave {
      flex: 0 0 auto;
      margin: clamp(18px, 4.4vw, 26px) 0 0 9px;
      font-size: clamp(21px, 5.7vw, 30px);
      line-height: 1;
      letter-spacing: -.03em;
    }
    @media (max-width: 360px) {
      .note-wrap { padding: 0 4px; }
      .note { font-size: clamp(86px, 29vw, 112px); }
      .octave { margin-left: 6px; font-size: 20px; }
    }

    .edge-glow {
      position: fixed;
      z-index: 5;
      inset: 5px;
      border: 2px solid transparent;
      border-radius: 32px;
      background: conic-gradient(from 214deg at 50% 50%, rgba(80,210,255,.92), rgba(105,121,255,.90) 16%, rgba(196,108,255,.94) 30%, rgba(255,91,207,.90) 46%, rgba(255,173,88,.86) 63%, rgba(80,229,214,.88) 78%, rgba(80,210,255,.92)) border-box;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: var(--tune-glow, 0);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(1px);
      transition: opacity .9s cubic-bezier(.22,.75,.25,1), box-shadow .9s cubic-bezier(.22,.75,.25,1);
      animation: edgeHue 11s ease-in-out infinite alternate;
      box-shadow: 0 0 25px rgba(143,120,255,.18), inset 0 0 24px rgba(255,137,211,.10);
    }
    .edge-glow::after {
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      content: "";
      background: conic-gradient(from 214deg at 50% 50%, rgba(74,214,255,.76), rgba(120,126,255,.72) 18%, rgba(210,108,255,.78) 35%, rgba(255,98,205,.70) 50%, rgba(255,175,93,.64) 66%, rgba(75,229,215,.68) 82%, rgba(74,214,255,.76));
      filter: blur(15px);
      opacity: .72;
      animation: edgeShimmer 5.8s ease-in-out infinite;
    }
    .edge-glow-aura {
      position: fixed;
      z-index: 4;
      inset: -11px;
      border: 18px solid transparent;
      border-radius: 44px;
      background: conic-gradient(from 214deg at 50% 50%, rgba(80,210,255,.62), rgba(105,121,255,.64) 16%, rgba(196,108,255,.72) 30%, rgba(255,91,207,.66) 46%, rgba(255,173,88,.58) 63%, rgba(80,229,214,.62) 78%, rgba(80,210,255,.62)) border-box;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: var(--tune-glow, 0);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(16px) saturate(1.2);
      transition: opacity 1s cubic-bezier(.22,.75,.25,1);
      animation: edgeShimmer 7.5s ease-in-out infinite;
    }
    body.in-tune .edge-glow { opacity: var(--tune-glow, 0); box-shadow: 0 0 55px rgba(143,120,255,.62), inset 0 0 46px rgba(255,144,218,.36); }
    body.in-tune .edge-glow::after { opacity: .94; }
    @keyframes edgeHue {
      0% { filter: blur(2px) hue-rotate(-10deg); }
      100% { filter: blur(3px) hue-rotate(18deg); }
    }
    @keyframes edgeShimmer {
      0%, 100% { transform: translate3d(-1%, 0, 0) scale(.99); }
      50% { transform: translate3d(1%, -1%, 0) scale(1.01); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-layer, .flow-layer::before, .flow-layer::after, .edge-glow-aura, .edge-glow, .edge-glow::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="flow-layer" aria-hidden="true"></div>
  <div class="edge-glow-aura" aria-hidden="true"></div>
  <div class="edge-glow" aria-hidden="true"></div>
  <main class="app">
    <div class="top-space" aria-hidden="true"></div>

    <section class="main" aria-label="实时调音器">
      <div class="hero">
        <div class="halo" aria-hidden="true"></div>
        <div class="note-wrap" aria-live="polite"><div id="note" class="note empty">·</div><span id="octave" class="octave"></span></div>
        <div id="frequency" class="frequency">— <small>Hz</small></div>
      </div>
      <div id="meter" class="meter" aria-label="音高偏差">
        <div id="scale" class="scale"><div id="needle" class="needle" aria-hidden="true"></div></div>
        <div class="reading"><span id="cents" class="cents">—</span><span id="readingStatus" class="reading-status" aria-label="等待声音">•</span></div>
      </div>
      <div id="state" class="sr-only" aria-live="polite">准备就绪</div>
    </section>

    <section class="controls" aria-label="调音器设置">
      <div class="listen-dock glass">
        <div class="signal signal-left" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button id="listen" class="listen" type="button" aria-label="开始调音" aria-pressed="false">
          <svg class="icon mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.8a3.6 3.6 0 0 0 3.6-3.6V7.6a3.6 3.6 0 1 0-7.2 0v4.6a3.6 3.6 0 0 0 3.6 3.6Zm5.3-3.6a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6.1 6.9V22h1.8v-2.9A7 7 0 0 0 19 12.2h-1.7Z"/></svg>
          <svg class="icon stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
        <div class="signal signal-right" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span id="privacy" class="ambient-dot" role="status" aria-label="未开始聆听"></span>
      </div>

      <div>
        <div class="reference glass">
          <div class="a4-meta"><span class="a4-tag">A4</span><div id="a4Value" class="value">440<small>Hz</small></div></div>
          <div class="ref-controls">
            <button class="adjust" type="button" data-direction="-1" aria-label="基准音高减 1 赫兹">−</button>
            <button class="adjust" type="button" data-direction="1" aria-label="基准音高加 1 赫兹">＋</button>
          </div>
        </div>
        <div class="reference-extra"><div class="range-wrap"><input id="a4Range" type="range" min="415" max="466" step="1" value="440" aria-label="A4 基准音高" /></div><button id="reset" class="reset" type="button" aria-label="重设为 440 赫兹">440</button></div>
      </div>
      <p id="notice" class="notice" aria-live="polite"></p>
    </section>
  </main>

  <script>
  (() => {
    "use strict";
    const NOTES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
    const ui = {
      listen: document.getElementById("listen"), state: document.getElementById("state"), note: document.getElementById("note"), octave: document.getElementById("octave"), frequency: document.getElementById("frequency"), meter: document.getElementById("meter"), scale: document.getElementById("scale"), needle: document.getElementById("needle"), cents: document.getElementById("cents"), readingStatus: document.getElementById("readingStatus"), privacy: document.getElementById("privacy"), a4Value: document.getElementById("a4Value"), a4Range: document.getElementById("a4Range"), reset: document.getElementById("reset"), notice: document.getElementById("notice")
    };
    let a4 = Number(localStorage.getItem("pitchline-a4")) || 440;
    const GLOW_START_CENTS = 34;
    const GLOW_FULL_CENTS = 5;
    let context, analyser, stream, data, raf, listening = false, smoothed, glowLevel = 0, lastPitchAt = 0, lastAnalysisAt = 0;

    function setNotice(message, error = false) {
      ui.notice.textContent = error ? message : "";
      ui.notice.classList.toggle("error", error);
    }
    function updateA4(value) {
      a4 = Math.max(415, Math.min(466, Number(value)));
      localStorage.setItem("pitchline-a4", String(a4));
      ui.a4Range.value = a4;
      ui.a4Range.style.setProperty("--range-progress", `${((a4 - 415) / 51) * 100}%`);
      ui.a4Value.innerHTML = `${a4}<small>Hz</small>`;
    }
    function setGlowTarget(target) {
      glowLevel += (target - glowLevel) * .22;
      if (Math.abs(target - glowLevel) < .004) glowLevel = target;
      document.body.style.setProperty("--tune-glow", glowLevel.toFixed(3));
    }
    function clearGlow() {
      glowLevel = 0;
      document.body.style.setProperty("--tune-glow", "0");
    }
    function clearReading() {
      ui.note.textContent = "·"; ui.note.classList.add("empty"); ui.note.classList.remove("live"); ui.octave.textContent = "";
      ui.frequency.innerHTML = `— <small>Hz</small>`;
      ui.cents.textContent = "—"; ui.readingStatus.textContent = "•"; ui.readingStatus.setAttribute("aria-label", "等待声音");
      ui.meter.classList.remove("in-tune", "sharp", "flat");
      document.body.classList.remove("in-tune");
      clearGlow();
      ui.needle.style.transform = "translateX(-50%)";
    }
    function noteFor(frequency) {
      const midi = Math.round(69 + 12 * Math.log2(frequency / a4));
      const target = a4 * 2 ** ((midi - 69) / 12);
      return { note: NOTES[(midi + 120) % 12], octave: Math.floor(midi / 12) - 1, target, cents: 1200 * Math.log2(frequency / target) };
    }
    function render(frequency) {
      const pitch = noteFor(frequency), cents = Math.round(pitch.cents), inTune = Math.abs(cents) <= 5, sharp = cents > 5;
      const distance = Math.abs(pitch.cents);
      const linearGlow = Math.max(0, Math.min(1, (GLOW_START_CENTS - distance) / (GLOW_START_CENTS - GLOW_FULL_CENTS)));
      const smoothGlow = linearGlow * linearGlow * (3 - 2 * linearGlow);
      setGlowTarget(smoothGlow);
      const bounded = Math.max(-50, Math.min(50, pitch.cents));
      const offset = (bounded / 100) * (ui.scale.clientWidth - 4);
      ui.note.textContent = pitch.note; ui.note.classList.remove("empty"); ui.note.classList.add("live"); ui.octave.textContent = pitch.octave;
      ui.frequency.innerHTML = `<strong>${frequency.toFixed(1)}</strong><small>Hz</small>`;
      ui.cents.textContent = `${cents > 0 ? "+" : ""}${cents}¢`;
      ui.needle.style.transform = `translateX(calc(-50% + ${offset}px))`;
      ui.meter.classList.toggle("in-tune", inTune); ui.meter.classList.toggle("sharp", sharp); ui.meter.classList.toggle("flat", !inTune && !sharp);
      document.body.classList.toggle("in-tune", inTune);
      if (inTune) { ui.state.textContent = "音准正确"; ui.readingStatus.textContent = "✓"; ui.readingStatus.setAttribute("aria-label", "音准正确"); }
      else if (sharp) { ui.state.textContent = "偏高"; ui.readingStatus.textContent = "↑"; ui.readingStatus.setAttribute("aria-label", "偏高，请调低"); }
      else { ui.state.textContent = "偏低"; ui.readingStatus.textContent = "↓"; ui.readingStatus.setAttribute("aria-label", "偏低，请调高"); }
    }

    // 轻量 YIN 基频检测：降低静音门槛，优先响应轻弹与较小音量的弦音。
    function detectPitch(buffer, sampleRate) {
      const size = buffer.length, half = size >> 1;
      let mean = 0, energy = 0;
      for (let i = 0; i < size; i++) mean += buffer[i];
      mean /= size;
      for (let i = 0; i < size; i++) { const sample = buffer[i] - mean; energy += sample * sample; }
      const rms = Math.sqrt(energy / size);
      if (rms < 0.0016) return null;
      const minTau = Math.max(2, Math.floor(sampleRate / 1600));
      const maxTau = Math.min(half - 2, Math.ceil(sampleRate / 40));
      const yin = new Float32Array(maxTau + 1);
      for (let tau = 1; tau <= maxTau; tau++) {
        let sum = 0;
        for (let i = 0; i < half; i++) { const diff = buffer[i] - buffer[i + tau]; sum += diff * diff; }
        yin[tau] = sum;
      }
      let running = 0;
      for (let tau = 1; tau <= maxTau; tau++) { running += yin[tau]; yin[tau] = yin[tau] * tau / (running || 1); }
      let estimate = -1;
      const threshold = rms < 0.0045 ? 0.22 : 0.16;
      for (let tau = minTau; tau <= maxTau; tau++) {
        if (yin[tau] < threshold) { while (tau < maxTau && yin[tau + 1] < yin[tau]) tau++; estimate = tau; break; }
      }
      if (estimate < 0) {
        let best = Infinity;
        for (let tau = minTau; tau <= maxTau; tau++) if (yin[tau] < best) { best = yin[tau]; estimate = tau; }
        if (best > (rms < 0.0045 ? 0.44 : 0.36)) return null;
      }
      const before = yin[estimate - 1] ?? yin[estimate], current = yin[estimate], after = yin[estimate + 1] ?? current;
      const denominator = 2 * (2 * current - before - after);
      const shift = denominator ? Math.max(-1, Math.min(1, (after - before) / denominator)) : 0;
      return sampleRate / (estimate + shift);
    }
    function frame() {
      if (!listening || !analyser || !context) return;
      const now = performance.now();
      if (now - lastAnalysisAt < 45) { raf = requestAnimationFrame(frame); return; }
      lastAnalysisAt = now;
      analyser.getFloatTimeDomainData(data);
      const detected = detectPitch(data, context.sampleRate);
      if (detected && Number.isFinite(detected)) {
        const related = !smoothed || Math.abs(1200 * Math.log2(detected / smoothed)) < 320;
        smoothed = related && smoothed ? smoothed * .62 + detected * .38 : detected;
        lastPitchAt = now; render(smoothed);
      } else if (now - lastPitchAt > 460) {
        smoothed = null; ui.state.textContent = "正在聆听"; clearReading();
      }
      raf = requestAnimationFrame(frame);
    }
    async function start() {
      if (!navigator.mediaDevices?.getUserMedia) { setNotice("此浏览器不支持麦克风访问，请使用新版 Safari。", true); return; }
      try {
        setNotice();
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        context = new (window.AudioContext || window.webkitAudioContext)();
        await context.resume();
        analyser = context.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0;
        context.createMediaStreamSource(stream).connect(analyser); data = new Float32Array(analyser.fftSize);
        listening = true; lastPitchAt = lastAnalysisAt = performance.now();
        ui.listen.classList.add("listening"); ui.listen.setAttribute("aria-label", "停止调音"); ui.listen.setAttribute("aria-pressed", "true"); ui.privacy.classList.add("active"); ui.privacy.setAttribute("aria-label", "正在聆听"); ui.state.textContent = "正在聆听"; document.querySelector(".hero").classList.add("listening");
        clearReading(); frame();
      } catch (error) {
        stop(); const denied = error && (error.name === "NotAllowedError" || error.name === "SecurityError");
        setNotice(denied ? "未获得麦克风权限，请在 Safari 的网站设置中允许麦克风。" : "无法启动麦克风，请确认没有其他应用正在占用。", true);
      }
    }
    function stop() {
      listening = false; if (raf) cancelAnimationFrame(raf); raf = null;
      if (stream) stream.getTracks().forEach(track => track.stop()); stream = null;
      if (context) context.close().catch(() => {}); context = analyser = data = undefined; smoothed = null;
      ui.listen.classList.remove("listening"); ui.listen.setAttribute("aria-label", "开始调音"); ui.listen.setAttribute("aria-pressed", "false"); ui.privacy.classList.remove("active"); ui.privacy.setAttribute("aria-label", "未开始聆听"); ui.state.textContent = "已暂停"; document.querySelector(".hero").classList.remove("listening"); clearReading(); setNotice();
    }
    for (let i = 0; i <= 24; i++) { const tick = document.createElement("span"); tick.className = `tick${i % 6 === 0 ? " major" : ""}${i === 12 ? " center" : ""}`; ui.scale.insertBefore(tick, ui.needle); }
    ui.listen.addEventListener("click", () => listening ? stop() : start());
    document.querySelectorAll("[data-direction]").forEach(button => button.addEventListener("click", () => updateA4(a4 + Number(button.dataset.direction))));
    ui.a4Range.addEventListener("input", event => updateA4(event.target.value)); ui.reset.addEventListener("click", () => updateA4(440));
    document.addEventListener("visibilitychange", () => { if (document.hidden && listening) stop(); });
    updateA4(a4); clearReading();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        const wasControlled = Boolean(navigator.serviceWorker.controller);
        let reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => { if (wasControlled && !reloading) { reloading = true; window.location.reload(); } });
        try { const registration = await navigator.serviceWorker.register("./sw.js"); await registration.update(); } catch (_) { /* 离线时使用缓存版本。 */ }
      });
    }
  })();
  </script>
</body>
</html>
